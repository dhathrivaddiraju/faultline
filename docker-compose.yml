version: '3.8'

services:
  # 1. High-Performance PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: faultline-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-faultline}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d faultline"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Event Stream & Ingestion Buffer
  redis:
    image: redis:7-alpine
    container_name: faultline-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. FastAPI Ingestion API & GraphQL/REST Core
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: faultline-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-faultline}
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-3-5-sonnet-20241022}
      - INGESTION_BATCH_SIZE=50
      - INGESTION_FLUSH_INTERVAL_MS=200
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 4. Asynchronous Ingestion & AI Worker Pool
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: faultline-worker
    restart: always
    command: ["python", "-m", "backend.app.worker"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-faultline}
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-3-5-sonnet-20241022}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. React Dashboard (Tailwind + Vite) on Nginx
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: faultline-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
