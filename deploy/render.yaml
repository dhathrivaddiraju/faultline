services:
  # 1. FastAPI Ingestion & Core API
  - type: web
    name: faultline-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt && pip install -e sdk/python"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: faultline-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: faultline-redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-3-5-sonnet-20241022

  # 2. React Vite Frontend
  - type: web
    name: faultline-dashboard
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://faultline-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  # 3. Redis Ingestion Cache & Stream
  - type: redis
    name: faultline-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  # 4. PostgreSQL Database
  - name: faultline-postgres
    databaseName: faultline
    user: postgres
    plan: free
